<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محصولات ZENIX</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    background: #080808;
    color: white;
}
header {
    background: #111;
    padding: 25px;
    text-align: center;
    border-bottom: 2px solid #d4af37;
}
.logo {
    color: #d4af37;
    font-size: 32px;
    font-weight: bold;
}
.container {
    max-width: 800px;
    margin: 60px auto;
    padding: 25px;
    text-align: center;
}
.product {
    background: #151515;
    border: 1px solid #d4af37;
    border-radius: 18px;
    padding: 40px 20px;
}
.icon {
    font-size: 90px;
    margin: 20px;
}
h1 {
    color: #d4af37;
}
p {
    color: #ccc;
    line-height: 2;
}
button {
    background: #d4af37;
    border: none;
    padding: 14px 35px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 20px;
}
a {
    color: #d4af37;
    display: block;
    margin-top: 25px;
}
</style>
</head>
<body>

<header>
    <div class="logo">ZENIX</div>
</header>

<div class="container">
    <div class="product">
        <div class="icon" id="icon">⚡</div>
        <h1 id="name">محصول ZENIX</h1>
        <p id="description">کیفیت بالا، طراحی حرفه‌ای و عملکرد عالی</p>
        <button>ثبت سفارش</button>
        <a href="index.html">بازگشت به فروشگاه</a>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("name").textContent =
    params.get("name") || "محصول ZENIX";

document.getElementById("description").textContent =
    params.get("description") || "کیفیت بالا و طراحی حرفه‌ای";

document.getElementById("icon").textContent =
    params.get("icon") || "⚡";
</script>

</body>
</html>
